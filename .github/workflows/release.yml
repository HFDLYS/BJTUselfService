name: Build and Publish Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.16.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build release and debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1 | sed 's/^v//')
            if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
            TAG="v${VERSION}-${GITHUB_SHA:0:7}"
            PRERELEASE=true
          fi

          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Prepared tag: ${TAG} (prerelease=${PRERELEASE})"

      - name: Build release and debug
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Prepare unsigned release APK
        shell: bash
        run: |
          BUILD_TOOLS_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOLS_VERSION=${BUILD_TOOLS_VERSION}" >> "$GITHUB_ENV"

          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk \
             app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Sign release APK
        id: sign-apk
        uses: tiann/zipalign-sign-android-release@e76990551f7797c24236f9d39e72b3c49851ea3c # v1.1.4
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          zipAlign: true
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp "${{ steps.sign-apk.outputs.signedReleaseFile }}" \
             "release-assets/BJTUSelfService-${VERSION}_arm64-v8a.apk"
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk \
             "release-assets/BJTUSelfService-${VERSION}_arm64-v8a-debug.apk"
          ls -lh release-assets

      - name: Generate release notes from commits
        shell: bash
        run: |
          CURRENT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -n "$CURRENT_TAG" ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log --no-merges -n 50 --pretty=format:"- [%s](https://github.com/${GITHUB_REPOSITORY}/commit/%H) (%h)" "$RANGE")

          {
            echo "## 更新内容"
            echo
            if [ -z "$COMMITS" ]; then
              echo "- 本次发布没有新的提交记录。"
            else
              echo "$COMMITS"
            fi
            echo
            echo "## 构建信息"
            echo
            echo "- 触发方式：<code>${GITHUB_EVENT_NAME}</code>"
            echo "- 提交：<code>${GITHUB_SHA:0:7}</code>"
            echo "- Release：<code>${RELEASE_TAG}</code>"
            echo
            echo "## 构建产物"
            echo
            echo "- <code>BJTUSelfService-${RELEASE_TAG#v}_arm64-v8a.apk</code>：release，已签名"
            echo "- <code>BJTUSelfService-${RELEASE_TAG#v}_arm64-v8a-debug.apk</code>：debug，使用 debug 签名"
          } > release_notes.md

          cat release_notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BJTUSelfService-${{ env.RELEASE_TAG }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: 交大自由行 ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: release-assets/*.apk
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
