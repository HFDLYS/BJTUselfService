name: KMP package

on:
  push:
    tags:
      - "v*-KMP*"
      - "v*-Liquid*"
      # 1.7.9 起应用版本不再带 KMP/Liquid 后缀。v1.7.0 仍是冻结根 Android 标签，
      # 由各打包任务跳过，避免和 release.yml 一起打出两套包。
      - "v*"
      # debug-* 只打包并上传 Actions 产物，不创建 GitHub Release / pre-release，
      # 因此应用内更新检查不会把它当成全量更新。
      - "debug-*"
  pull_request:
    paths:
      - ".github/workflows/kmp-package.yml"
      - "multiplatform/scripts/sign-ios-sideload-app.sh"
      - "multiplatform/iosApp/**"
  workflow_dispatch:

concurrency:
  group: kmp-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shell/ZIP timestamps and JVM packaging tools use Beijing time on every platform.
  TZ: Asia/Shanghai
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android arm64 release APK
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.7.0') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplatform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v4 默认还会请求已从新版 SDK 移除的 legacy `tools` 包。
          packages: platform-tools

      - name: Restore Android upload keystore
        env:
          BJTU_ANDROID_KEYSTORE_BASE64: ${{ secrets.BJTU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BJTU_ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret BJTU_ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          raw = os.environ["BJTU_ANDROID_KEYSTORE_BASE64"]
          path = pathlib.Path.home() / ".android" / "bjtu-kmp-upload.keystore"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(base64.b64decode(raw))
          path.chmod(0o600)
          print(f"keystore_bytes={path.stat().st_size}")
          PY
          echo "BJTU_ANDROID_KEYSTORE=$HOME/.android/bjtu-kmp-upload.keystore" >> "$GITHUB_ENV"

      - name: Build arm64 release APK
        env:
          BJTU_ANDROID_STORE_PASSWORD: ${{ secrets.BJTU_ANDROID_STORE_PASSWORD }}
          BJTU_ANDROID_KEY_ALIAS: ${{ secrets.BJTU_ANDROID_KEY_ALIAS }}
          BJTU_ANDROID_KEY_PASSWORD: ${{ secrets.BJTU_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Rename APK
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          VERSION="${VERSION%-KMP}"
          APK="$(find androidApp/build/outputs/apk/release -type f -name '*-arm64-v8a-release.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "arm64-v8a release APK not found"
            find androidApp/build/outputs/apk/release -type f -name '*.apk' -print
            exit 1
          fi
          test -n "$VERSION"
          test -f "$APK"
          NAME="BJTUSelfService-KMP-${VERSION}-arm64-v8a.apk"
          cp "$APK" "$NAME"
          # Keep the signed APK contents intact; refresh only the output file mtime.
          touch "$NAME"
          echo "Packaged at $(date '+%Y-%m-%d %H:%M:%S %z') (Asia/Shanghai)"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kmp-android-apk
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  windows:
    name: Windows MSI
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.7.0') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Windows timezone to Beijing
        run: |
          # Native Windows packaging tools do not consistently honor TZ.
          tzutil /s "China Standard Time"
          if ($LASTEXITCODE -ne 0) { throw "Failed to set Windows timezone" }

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check jpackage
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          $jp = Join-Path $env:JAVA_HOME "bin\jpackage.exe"
          if (-not (Test-Path $jp)) { throw "jpackage missing: $jp" }
          Write-Host "jpackage=$jp"
          & $jp --version
          chcp 65001 | Out-Null

      - name: Build MSI
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          # jpackage 按 JVM 默认语言挑 WiX 本地化文件：英文 runner 用 en（代码页 1252），
          # 中文名会被打成 ??? 并报 LGHT0311。强制 zh_CN 让它改用代码页 936 的中文 .wxl，
          # 这样安装器、开始菜单和快捷方式都能用中文名「交大自由行 KMP」。
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=zh -Duser.country=CN -Duser.timezone=Asia/Shanghai
        run: |
          chcp 65001 | Out-Null
          .\gradlew.bat :windowsApp:packageMsi --stacktrace

      - name: Print jpackage logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "windowsApp\build\compose\logs","windowsApp\build\jpackage-shim" -Include *.txt,*.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue
          }

      - name: Rename MSI
        id: artifact
        run: |
          $version = (Select-String -Path "shared\src\commonMain\kotlin\team\bjtuss\bjtuselfservice\shared\update\AppUpdateChecker.kt" -Pattern 'CURRENT_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $version = $version -replace '-KMP$', ''
          $msi = Get-ChildItem "windowsApp\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          $name = "BJTUselfServiceKMP-$version.msi"
          Copy-Item $msi.FullName $name
          # Store the real instant; the runner displays it in China Standard Time.
          (Get-Item $name).LastWriteTimeUtc = [DateTime]::UtcNow
          Write-Host "Packaged at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss zzz') (Asia/Shanghai)"
          "file=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $name | Format-List Name, Length, LastWriteTime

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: kmp-windows-msi
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  macos:
    name: macOS DMG
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.7.0') }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build macOS DMG
        env:
          DESKTOP_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Rename DMG
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          VERSION="${VERSION%-KMP}"
          DMG="$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -n 1)"
          test -n "$VERSION"
          test -f "$DMG"
          NAME="BJTUselfServiceKMP-${VERSION}.dmg"
          cp "$DMG" "$NAME"
          touch "$NAME"
          echo "Packaged at $(date '+%Y-%m-%d %H:%M:%S %z') (Asia/Shanghai)"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: kmp-macos-dmg
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  ios:
    name: iOS sideload IPA
    permissions:
      contents: read
    env:
      IOS_CONFIGURATION: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}
    # Duo / 系统栏用了 iOS 27.1 API（axisBehavior、verticalBarEdge、
    # navigationBarMinimization）。macos-26 默认 Xcode 26.6 / iPhoneOS 26.5，
    # `#available` 挡不住编译。必须用 xcode-27 镜像并选 27.1+ SDK。
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'v1.7.0' }}
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: multiplatform
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Select Xcode 27.1+
        run: |
          ls /Applications | grep -i xcode || true
          SELECTED=""
          for path in \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.1_beta.app \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.2_beta.app
          do
            if [ -d "$path/Contents/Developer" ]; then
              SELECTED="$path"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "Need Xcode 27.1+ with iPhoneOS 27.1 SDK"
            exit 1
          fi
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK=$SDK"
          python3 - <<'PY'
          import subprocess, sys
          sdk = subprocess.check_output(
              ["xcrun", "--sdk", "iphoneos", "--show-sdk-version"],
              text=True,
          ).strip()
          parts = [int(p) for p in sdk.split(".")[:2]]
          if parts < [27, 1]:
              print(f"Need iPhoneOS SDK >= 27.1, got {sdk}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Build unsigned iOS app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x ./gradlew
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration "$IOS_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        id: artifact
        run: |
          VERSION="$(sed -n 's/.*CURRENT_VERSION = "\([^"]*\)".*/\1/p' shared/src/commonMain/kotlin/team/bjtuss/bjtuselfservice/shared/update/AppUpdateChecker.kt | head -n 1)"
          VERSION="${VERSION%-KMP}"
          APP="$(find "iosApp/DerivedData/Build/Products/$IOS_CONFIGURATION-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$VERSION"
          test -d "$APP"
          NAME="BJTUSelfService-KMP-${VERSION}-iOS-unsigned.ipa"
          if [ "$IOS_CONFIGURATION" = Debug ]; then
            NAME="BJTUSelfService-KMP-${VERSION}-iOS-Debug-sideload.ipa"
          fi
          rm -rf ipa-stage
          mkdir -p ipa-stage/Payload
          APP_NAME="BJTUselfServiceKMP.app"
          cp -R "$APP" "ipa-stage/Payload/$APP_NAME"
          mv "ipa-stage/Payload/$APP_NAME/交大自由行 KMP" "ipa-stage/Payload/BJTUselfServiceKMP.app/BJTUselfServiceKMP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable BJTUselfServiceKMP' "ipa-stage/Payload/$APP_NAME/Info.plist"
          # Ad-hoc signing preserves entitlements for SideStore to discover and re-sign.
          # This is not a provisioning profile or a device-installable Apple signature.
          bash scripts/sign-ios-sideload-app.sh "ipa-stage/Payload/$APP_NAME"
          # Normalize mtimes after signing. ZIP's DOS timestamps have no timezone;
          # -X omits extra UTC timestamps so readers use the Beijing wall time.
          STAMP="$(date +%Y%m%d%H%M.%S)"
          find ipa-stage -exec touch -h -t "$STAMP" {} +
          codesign --verify --deep --strict "ipa-stage/Payload/$APP_NAME"
          (cd ipa-stage && zip -qry -X "../$NAME" Payload)
          unzip -tq "$NAME"
          touch -t "$STAMP" "$NAME"
          echo "Packaged at $(date '+%Y-%m-%d %H:%M:%S %z') (Asia/Shanghai)"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kmp-ios-ipa
          path: multiplatform/${{ steps.artifact.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub Release
    permissions:
      contents: write
    needs: [android, windows, macos, ios]
    # 只给正式 v* 标签发 GitHub Release。debug-* / alpha / beta 标签只保留 Actions 产物，
    # 避免应用内更新检查把调试包当成全量更新或 pre-release。
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref_name, 'debug-') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && needs.android.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/releases

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kmp-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}：交大自由行 KMP 正式版
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
