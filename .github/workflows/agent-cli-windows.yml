name: Agent CLI smoke (Windows)

# AI Agent 命令行在 Windows 上的冒烟测试：打包后的 GUI exe 经管道/重定向句柄输出 JSON，
# 没有缓存时按约定退出码 2，参数错误为 64。macOS 由本机验证。
on:
  push:
    branches:
      - "feat/ai-agent*"
  pull_request:
    paths:
      - ".github/workflows/agent-cli-windows.yml"
      - "multiplatform/windowsApp/**"
      - "multiplatform/shared/src/desktopMain/**/agent/**"
      - "multiplatform/shared/src/commonMain/**/agent/**"

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  windows-cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Create distributable
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          WINDOWS_PACKAGE_NAME: BJTUselfServiceKMP
        run: .\gradlew.bat :windowsApp:createDistributable --stacktrace

      - name: Run CLI with redirected handles (how agents spawn it)
        run: |
          $exe = (Resolve-Path "windowsApp\build\compose\binaries\main\app\BJTUselfServiceKMP\BJTUselfServiceKMP.exe").Path
          function Invoke-Cli([string]$arguments) {
            $psi = New-Object Diagnostics.ProcessStartInfo $exe, $arguments
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $psi.StandardOutputEncoding = [Text.Encoding]::UTF8
            $psi.StandardErrorEncoding = [Text.Encoding]::UTF8
            $p = [Diagnostics.Process]::Start($psi)
            $out = $p.StandardOutput.ReadToEnd()
            $err = $p.StandardError.ReadToEnd()
            $p.WaitForExit()
            Write-Host "[$arguments] exit=$($p.ExitCode)`nstdout=$out`nstderr=$err"
            return @{ Code = $p.ExitCode; Out = $out; Err = $err }
          }
          $help = Invoke-Cli "agent help"
          if ($help.Code -ne 0 -or -not $help.Out.Contains("calendar")) { throw "help failed" }
          $status = Invoke-Cli "agent status --json"
          if ($status.Code -ne 2) { throw "expected exit 2 without cache" }
          $json = $status.Out | ConvertFrom-Json
          if ($json.schemaVersion -ne 1 -or -not $json.error) { throw "unexpected JSON" }
          $bad = Invoke-Cli "agent calendar --from 2026-13-01"
          if ($bad.Code -ne 64) { throw "expected usage exit 64" }

      - name: Install skill and call through bjtu.cmd
        run: |
          $exe = (Resolve-Path "windowsApp\build\compose\binaries\main\app\BJTUselfServiceKMP\BJTUselfServiceKMP.exe").Path
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, "agent install --no-claude"
          $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true; $psi.UseShellExecute = $false
          $psi.StandardOutputEncoding = [Text.Encoding]::UTF8; $psi.StandardErrorEncoding = [Text.Encoding]::UTF8
          $p = [Diagnostics.Process]::Start($psi); $out = $p.StandardOutput.ReadToEnd(); $err = $p.StandardError.ReadToEnd(); $p.WaitForExit()
          Write-Host "install exit=$($p.ExitCode)`n$out`n$err"
          if ($p.ExitCode -ne 0) { throw "install failed" }
          $cmd = Join-Path $env:LOCALAPPDATA "BJTUselfServiceKMP\bin\bjtu.cmd"
          $skill = Join-Path $env:USERPROFILE ".agents\skills\bjtuss\SKILL.md"
          if (-not (Test-Path $cmd) -or -not (Test-Path $skill)) { throw "files missing" }
          $json = & $cmd status --json | Out-String
          Write-Host "bjtu.cmd status exit=$LASTEXITCODE`n$json"
          if ($LASTEXITCODE -ne 2) { throw "expected exit 2 through bjtu.cmd" }
          if (($json | ConvertFrom-Json).schemaVersion -ne 1) { throw "bad JSON through bjtu.cmd" }
          & $exe agent uninstall | Out-String | Write-Host
          if ((Test-Path $cmd) -or (Test-Path $skill)) { throw "uninstall left files" }
          exit 0
