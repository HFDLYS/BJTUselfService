name: Agent CLI spike (Windows)

# feat/ai-agent spike: verifies the packaged Windows exe can serve a headless CLI over pipes.
# Remove before merging the agent feature.
on:
  push:
    branches:
      - "feat/ai-agent"
    paths:
      - ".github/workflows/agent-cli-spike.yml"
      - "multiplatform/windowsApp/**"
      - "multiplatform/shared/src/desktopMain/**/agent/**"

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  windows-cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multiplatform
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Create distributable
        env:
          WINDOWS_PACKAGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          WINDOWS_PACKAGE_NAME: BJTUselfServiceKMP
        run: .\gradlew.bat :windowsApp:createDistributable --stacktrace

      - name: Inspect runtime
        run: |
          $app = "windowsApp\build\compose\binaries\main\app\BJTUselfServiceKMP"
          Get-ChildItem $app | Format-Table Name, Length
          Write-Host "java.exe present: $(Test-Path "$app\runtime\bin\java.exe")"
          Write-Host "javaw.exe present: $(Test-Path "$app\runtime\bin\javaw.exe")"

      - name: Run exe through a pipe
        run: |
          $exe = "windowsApp\build\compose\binaries\main\app\BJTUselfServiceKMP\BJTUselfServiceKMP.exe"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $info = & $exe agent spike info | Out-String
          Write-Host "info exit=$LASTEXITCODE elapsedMs=$($sw.ElapsedMilliseconds) output=[$info]"
          $dpapi = & $exe agent spike dpapi | Out-String
          Write-Host "dpapi exit=$LASTEXITCODE output=[$dpapi]"
          & $exe agent bogus 2>&1 | Out-String | Write-Host
          Write-Host "bogus exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 64) { throw "unexpected exit code" }
          exit 0

      - name: Run exe with redirected handles (how agents spawn it)
        run: |
          $exe = (Resolve-Path "windowsApp\build\compose\binaries\main\app\BJTUselfServiceKMP\BJTUselfServiceKMP.exe").Path
          $psi = New-Object Diagnostics.ProcessStartInfo $exe, "agent spike info"
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEnd()
          $err = $p.StandardError.ReadToEnd()
          $p.WaitForExit()
          Write-Host "exit=$($p.ExitCode) stdout=[$out] stderr=[$err]"
          if (-not $out.Contains('"headless":true')) { throw "stdout not captured" }
